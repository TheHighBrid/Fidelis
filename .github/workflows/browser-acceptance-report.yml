name: Browser acceptance report integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  report-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/browser-acceptance.mjs
      - run: node --test tests/test_browser_acceptance_report.mjs
