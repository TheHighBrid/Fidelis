name: Fidelis CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-sweep-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy scikit-image opencv-python-headless pyyaml httpx==0.28.1 pytest

      - name: F09 confidence routing and protection contracts
        run: |
          python -m unittest discover -s tests -p 'test_confidence*.py' -v
          python -m unittest discover -s tests -p 'test_f09_confidence_boundary_contract.py' -v

      - name: Studio integration history and conflict preflight regressions
        run: python -m unittest discover -s tests -p 'test_studio_integration_gate.py' -v

      - name: Static smoke tests
        run: bash tests/smoke-test.sh

      - name: CLI model-selection tests
        run: bash tests/test-cli-model-selection.sh

      - name: Photo candidate installer tests
        run: bash tests/test-photo-candidate-installer.sh

      - name: Photo candidate benchmark tests
        run: bash tests/test-photo-candidate-benchmark.sh

      - name: Audition report generator tests
        run: bash tests/test-audition-report.sh

      - name: Batch audition tests
        run: bash tests/test-batch-audition.sh

      - name: Fidelity metrics evaluation tests
        run: bash tests/test-fidelity-metrics.sh

      - name: Legacy synthetic calibration pair alignment
        run: python -m unittest discover -s tests -p 'test_corpus_alignment.py'

      - name: Corpus rights and ROI manifest validation
        run: |
          python -m unittest discover -s tests -p 'test_corpus_manifest.py'
          python -m unittest discover -s tests -p 'test_melato_corpus_manifest.py'

      - name: Photographic restoration protocol regressions
        run: python -m unittest discover -s tests -p 'test_photographic_protocol.py'

      - name: Zero-cost F06 RealeSR-general-v3 workflow qualification tests
        run: python -m unittest discover -s tests -p 'test_f06_realesr_qualification.py'

      - name: Legacy metric redaction contract tests
        run: python -m unittest discover -s tests -p 'test_metric_contract.py'

      - name: Geometric and drift detector tests
        run: bash tests/test-detect-drift.sh

      - name: Tiled upscaling border and seam fidelity tests
        run: python -m unittest discover -s tests -p 'test_tiler.py'

      - name: Streamed tiled compositor regression tests
        run: python -m unittest discover -s tests -p 'test_streaming_tiler.py'

      - name: Region protection and reblend export tests
        run: python -m unittest discover -s tests -p 'test_region*.py'

      - name: Product edge and ROI preservation tests
        run: python -m unittest discover -s tests -p 'test_product_upscale.py'

      - name: Saved master export recovery tests
        run: python -m unittest discover -s tests -p 'test_studio_batch_export.py'

      - name: Local ComfyUI protocol and capability tests
        run: python -m unittest discover -s tests -p 'test_comfy*.py'

      - name: Source-bound mask suggestion staging and protection tests
        run: |
          python -m unittest discover -s tests -p 'test_mask_suggestions.py'
          python -m unittest discover -s tests -p 'test_confidence*.py'
          python -m unittest discover -s tests -p 'test_f09_confidence_boundary_contract.py'

      - name: Explicit benchmark inventory and freeze contracts
        run: python -m unittest discover -s tests -p 'test_corpus_manifest.py'

      - name: Native image-pixel crop and inspector contracts
        run: python -m unittest discover -s tests -p 'test_native_inspection.py'

      - name: Durable background generation and cancellation tests
        run: |
          python -m unittest discover -s tests -p 'test_generation_queue.py'
          python -m unittest discover -s tests -p 'test_cancellation_registry.py'
          python -m unittest discover -s tests -p 'test_async_queue_qualification.py'

      - name: CLI tiled upscaling integration tests
        run: python -m unittest discover -s tests -p 'test_tiled_upscale_cli.py'

      - name: Tiled pipeline output receipt regression tests
        run: python -m unittest discover -s tests -p 'test_tiled_pipeline_entrypoint.py'

      - name: Optional face detector fallback tests
        run: python -m unittest discover -s tests -p 'test_face_fallback.py'

      - name: Web upload validation tests
        run: python -m unittest discover -s tests -p 'test_web_uploads.py'

      - name: Main integrity gates for provenance, tiling, export, exposure and color
        run: |
          python -m unittest discover -s tests -p 'test_unsigned_provenance.py'
          python -m unittest discover -s tests -p 'test_tiled_pipeline_entrypoint.py'
          python -m unittest discover -s tests -p 'test_protected_export_integrity.py'
          python -m unittest discover -s tests -p 'test_studio_png_single_frame.py'
          python -m unittest discover -s tests -p 'test_structure_screen_contract.py'
          python -m unittest discover -s tests -p 'test_current_main_handoff.py'
          python -m unittest discover -s tests -p 'test_deployment_exposure.py'
          python -m unittest discover -s tests -p 'test_color_stabilization_routing.py'

      - name: Studio interaction regression tests
        run: |
          node --test tests/test-studio-interactions.cjs
          node --test tests/review-ui.cjs
          node --test tests/test_browser_acceptance_report.mjs
          node tests/native-inspection-ui.cjs fidelis/studio/studio.html
          python -m unittest discover -s tests -p 'test_browser_evidence.py'

      - name: Instrumented pipeline integrity and metric reference tests
        run: python -m unittest discover -s tests -p 'test_pipeline_integrity.py'

      - name: Pipeline metric reference routing regressions
        run: python -m unittest discover -s tests -p 'test_pipeline_reference_routing.py'

      - name: Native-grid texture and material detail quality gates
        run: python -m unittest discover -s tests -p 'test_detail_metrics.py'

      - name: ROI normalization regressions
        run: python -m unittest discover -s tests -p 'test_roi_normalization.py'

      - name: Local server and deployment boundary tests
        run: python -m unittest discover -s tests -p 'test_local_server_defaults.py'

      - name: Main branch loopback and streamed export ownership regressions
        run: |
          python -m unittest discover -s tests -p 'test_local_bind_default.py'
          python -m unittest discover -s tests -p 'test_streaming_output_ownership.py'

      - name: Structural ROI protection and crop check tests
        run: python -m unittest discover -s tests -p 'test_structural_roi.py'

      - name: Model provenance and license audit tests
        run: python -m unittest discover -s tests -p 'test_model_provenance.py'

      - name: Live worker preflight and VRAM budget tests
        run: python -m unittest discover -s tests -p 'test_worker_preflight.py'

      - name: Internal ROI drift screening and protection tests
        run: python -m unittest discover -s tests -p 'test_roi_protection.py'

      - name: Color-managed 16-bit and provenance export tests
        run: python -m unittest discover -s tests -p 'test_managed_export.py'

      - name: Comparator runner adapter and cost normalization tests
        run: python -m unittest discover -s tests -p 'test_comparators.py'

      - name: Hybrid texture, restoration runner, and Melato audition tests
        run: |
          python -m unittest discover -s tests -p 'test_hybrid_texture.py'
          python -m unittest discover -s tests -p 'test_restoration_runner.py'
          python -m unittest discover -s tests -p 'test_model_audition.py'

      - name: Held-out quality acceptance and inter-rater reliability tests
        run: python -m unittest discover -s tests -p 'test_quality_acceptance.py'

      - name: Resumable batch runner and rate-limit tests
        run: python -m unittest discover -s tests -p 'test_batch_runner.py'

      - name: Studio packaging, upgrade and rollback verification tests
        run: |
          python -m unittest discover -s tests -p 'test_release_packaging.py'
          python -m unittest discover -s tests -p 'test_offline_model_redistribution.py'

      - name: Release readiness dossier and signoff audit tests
        run: |
          python -m unittest discover -s tests -p 'test_release_readiness.py'
          python -m unittest discover -s tests -p 'test_release_readiness_gate.py'

      - name: Adversarial invariant and research capture tests
        run: |
          python -m unittest discover -s tests -p 'test_adversarial_packaging_and_roi_invariants.py'
          python -m unittest discover -s tests -p 'test_gate_f07_f08_adversarial.py'
          python -m unittest discover -s tests -p 'test_contextdev_research.py'

      - name: Pytest protocol, coffee regression, and tiered E2E suites
        run: python -m pytest tests/test_coffee_regression.py tests/test_melato_protocol.py tests/e2e/ -q

      - name: Web UI server integration tests
        run: bash tests/test-web-ui.sh

      - name: Release packaging and offline bundle tests
        run: bash tests/test-release-pipeline.sh

      - name: VOSR sweep regression tests
        run: bash tests/test-vosr-sweep.sh
