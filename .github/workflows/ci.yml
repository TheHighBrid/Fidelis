name: Fidelis CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-sweep-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy scipy scikit-image opencv-python-headless pyyaml

      - name: Static smoke tests
        run: bash tests/smoke-test.sh

      - name: CLI model-selection tests
        run: bash tests/test-cli-model-selection.sh

      - name: Photo candidate installer tests
        run: bash tests/test-photo-candidate-installer.sh

      - name: Photo candidate benchmark tests
        run: bash tests/test-photo-candidate-benchmark.sh

      - name: Audition report generator tests
        run: bash tests/test-audition-report.sh

      - name: Batch audition tests
        run: bash tests/test-batch-audition.sh

      - name: Fidelity metrics evaluation tests
        run: bash tests/test-fidelity-metrics.sh

      - name: Geometric and drift detector tests
        run: bash tests/test-detect-drift.sh

      - name: Tiled upscaling border and seam fidelity tests
        run: python -m unittest discover -s tests -p 'test_tiler.py'

      - name: CLI tiled upscaling integration tests
        run: python -m unittest discover -s tests -p 'test_tiled_upscale_cli.py'

      - name: Web UI server integration tests
        run: bash tests/test-web-ui.sh

      - name: Release packaging and offline bundle tests
        run: bash tests/test-release-pipeline.sh

      - name: VOSR sweep regression tests
        run: bash tests/test-vosr-sweep.sh
