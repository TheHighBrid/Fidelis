name: Fidelis CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-and-sweep-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Static smoke tests
        run: bash tests/smoke-test.sh

      - name: CLI model-selection tests
        run: bash tests/test-cli-model-selection.sh

      - name: VOSR sweep regression tests
        run: bash tests/test-vosr-sweep.sh

      - name: Probe pinned photo candidate sources
        run: bash tests/probe-photo-candidate-sources.sh
