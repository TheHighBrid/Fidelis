---
# Codacy Static Code Analysis Configuration
# Documentation: https://docs.codacy.com/repositories-configure/codacy-configuration-file/

exclude_paths:
  - "tests/**"
  - "docs/**"
  - "dist/**"
  - "experiments/**"
  - "config/**"
  - "notebooks/**"
  - "android/**"
  - "deploy/**"
  - "v2/**"
  - "bin/**"

engines:
  bandit:
    exclude_paths:
      - "tests/**"
      - "scripts/**"
      - "deploy/**"
  semgrep:
    exclude_paths:
      - "tests/**"
      - "scripts/**"
      - "deploy/**"
  ruff:
    exclude_paths:
      - "tests/**"
      - "docs/**"
      - "deploy/**"
  duplication:
    exclude_paths:
      - "**"
  metric:
    exclude_paths:
      - "**"
