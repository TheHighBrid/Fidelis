services:
  fidelis:
    build:
      context: .
      dockerfile: Dockerfile
    image: fidelis-studio:latest
    container_name: fidelis_studio
    restart: always
    ports:
      - "8080:8080"
    environment:
      - FIDELIS_HOME=/root/.local/share/fidelis
      - PORT=8080
    volumes:
      - fidelis_data:/root/.local/share/fidelis
      - ./experiments/eval_crops:/app/experiments/eval_crops:ro

volumes:
  fidelis_data:
    driver: local
